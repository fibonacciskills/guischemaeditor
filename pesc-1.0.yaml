openapi: 3.0.0
info:
  title: PESC XML Schema API
  description: |
    OpenAPI 3.0 specification for PESC (Postsecondary Education Standards Council) XML Schema.
    PESC provides standard data exchange formats for education and workforce information,
    enabling interoperability between educational institutions and organizations.
    This API represents common PESC data structures and their relationships.
  version: 1.0.0
  contact:
    name: PESC
    url: https://www.pesc.org
  license:
    name: PESC License
    url: https://www.pesc.org/documents/

servers:
  - url: https://api.pesc.org/v1
    description: PESC Production Server
  - url: https://staging-api.pesc.org/v1
    description: PESC Staging Server

tags:
  - name: Transcript
    description: Academic transcript operations
  - name: Enrollment
    description: Student enrollment information
  - name: Degree
    description: Degree and academic credential information
  - name: Organization
    description: Educational organization information

paths:
  /transcripts:
    get:
      tags:
        - Transcript
      summary: List academic transcripts
      description: Retrieve a list of academic transcripts
      operationId: listTranscripts
      parameters:
        - name: studentId
          in: query
          description: Filter by student ID
          required: false
          schema:
            type: string
            format: uuid
        - name: institutionId
          in: query
          description: Filter by institution ID
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of records to return
          required: false
          schema:
            type: integer
            format: int32
            default: 100
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: Successfully retrieved transcript list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AcademicRecord'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
    post:
      tags:
        - Transcript
      summary: Create a new academic transcript
      description: Submit a new academic transcript record
      operationId: createTranscript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicRecord'
      responses:
        '201':
          description: Transcript created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicRecord'
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized
        '409':
          description: Duplicate record
        '500':
          description: Internal server error

  /transcripts/{transcriptId}:
    get:
      tags:
        - Transcript
      summary: Get academic transcript by ID
      description: Retrieve a specific academic transcript
      operationId: getTranscript
      parameters:
        - name: transcriptId
          in: path
          description: The unique identifier of the transcript
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved transcript
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicRecord'
        '401':
          description: Unauthorized
        '404':
          description: Transcript not found
        '500':
          description: Internal server error
    put:
      tags:
        - Transcript
      summary: Update academic transcript
      description: Update an existing academic transcript
      operationId: updateTranscript
      parameters:
        - name: transcriptId
          in: path
          description: The unique identifier of the transcript
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicRecord'
      responses:
        '200':
          description: Transcript updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicRecord'
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized
        '404':
          description: Transcript not found
        '500':
          description: Internal server error

  /enrollments:
    get:
      tags:
        - Enrollment
      summary: List student enrollments
      description: Retrieve student enrollment records
      operationId: listEnrollments
      parameters:
        - name: studentId
          in: query
          description: Filter by student ID
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by enrollment status
          required: false
          schema:
            type: string
            enum:
              - Active
              - Inactive
              - Graduated
              - Withdrawn
              - OnLeave
      responses:
        '200':
          description: Successfully retrieved enrollment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnrollmentRecord'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
    post:
      tags:
        - Enrollment
      summary: Create enrollment record
      description: Create a new student enrollment record
      operationId: createEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRecord'
      responses:
        '201':
          description: Enrollment record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentRecord'
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

components:
  schemas:
    AcademicRecord:
      type: object
      description: Represents a student's academic transcript record
      required:
        - recordId
        - studentId
        - institutionId
        - recordDate
      properties:
        recordId:
          type: string
          format: uuid
          description: Unique identifier for this academic record
        studentId:
          type: string
          format: uuid
          description: Unique identifier of the student
        institutionId:
          type: string
          description: Unique identifier of the educational institution
        recordDate:
          type: string
          format: date
          description: Date the record was issued
        studentName:
          $ref: '#/components/schemas/PersonName'
        coursesTaken:
          type: array
          description: List of courses completed
          items:
            $ref: '#/components/schemas/Course'
        cumulativeGPA:
          type: number
          format: float
          description: Cumulative grade point average
          minimum: 0.0
          maximum: 4.0
        creditsEarned:
          type: number
          format: float
          description: Total credits earned
          minimum: 0
        creditsAttempted:
          type: number
          format: float
          description: Total credits attempted
          minimum: 0
        academicStanding:
          type: string
          description: Student's current academic standing
          enum:
            - GoodStanding
            - Probation
            - Suspension
            - Dismissal
        transcriptType:
          type: string
          description: Type of transcript
          enum:
            - Official
            - Unofficial
            - Certified
        createdDateTime:
          type: string
          format: date-time
          description: Timestamp when record was created
        modifiedDateTime:
          type: string
          format: date-time
          description: Timestamp when record was last modified

    EnrollmentRecord:
      type: object
      description: Represents a student's enrollment in a program
      required:
        - enrollmentId
        - studentId
        - programId
        - enrollmentDate
        - status
      properties:
        enrollmentId:
          type: string
          format: uuid
          description: Unique identifier for this enrollment
        studentId:
          type: string
          format: uuid
          description: Unique identifier of the student
        programId:
          type: string
          description: Unique identifier of the program
        enrollmentDate:
          type: string
          format: date
          description: Date of enrollment
        expectedGraduationDate:
          type: string
          format: date
          description: Expected graduation date
        status:
          type: string
          description: Current enrollment status
          enum:
            - Active
            - Inactive
            - Graduated
            - Withdrawn
            - OnLeave
            - Suspended
            - Dismissed
        enrollmentType:
          type: string
          description: Type of enrollment
          enum:
            - FullTime
            - PartTime
            - HalfTime
        creditHoursPerTerm:
          type: number
          format: float
          description: Credit hours per term
        degreeLevel:
          type: string
          description: Level of degree being pursued
          enum:
            - Associate
            - Bachelor
            - Master
            - Doctorate
            - Certificate
            - Other
        major:
          type: string
          description: Primary field of study
        gpa:
          type: number
          format: float
          description: Current GPA
          minimum: 0.0
          maximum: 4.0
        startDate:
          type: string
          format: date
          description: Program start date
        endDate:
          type: string
          format: date
          description: Program end date

    Course:
      type: object
      description: Represents a course completed by a student
      required:
        - courseId
        - courseCode
        - courseName
        - credits
        - grade
      properties:
        courseId:
          type: string
          description: Unique course identifier
        courseCode:
          type: string
          description: Course code (e.g., CS101)
        courseName:
          type: string
          description: Full name of the course
        credits:
          type: number
          format: float
          description: Credit hours for this course
          minimum: 0
        grade:
          type: string
          description: Letter grade received
          enum:
            - 'A'
            - 'A-'
            - 'B+'
            - 'B'
            - 'B-'
            - 'C+'
            - 'C'
            - 'C-'
            - 'D+'
            - 'D'
            - 'D-'
            - 'F'
            - 'W'
            - 'I'
            - 'P'
            - 'NP'
        gradePoints:
          type: number
          format: float
          description: Numeric grade points
          minimum: 0.0
          maximum: 4.0
        completionDate:
          type: string
          format: date
          description: Date course was completed
        courseDescription:
          type: string
          description: Description of course content
        department:
          type: string
          description: Department offering the course
        level:
          type: string
          description: Course level
          enum:
            - Remedial
            - Developmental
            - Undergraduate
            - Graduate
            - Professional

    PersonName:
      type: object
      description: Represents a person's name components
      properties:
        firstName:
          type: string
          description: First name
        middleName:
          type: string
          description: Middle name
        lastName:
          type: string
          description: Last name
        suffix:
          type: string
          description: Name suffix (Jr., Sr., III, etc.)
        fullName:
          type: string
          description: Complete name

    DegreeInformation:
      type: object
      description: Information about a degree or credential
      required:
        - degreeId
        - degreeName
        - degreeLevel
      properties:
        degreeId:
          type: string
          description: Unique degree identifier
        degreeName:
          type: string
          description: Name of the degree
        degreeLevel:
          type: string
          description: Level of the degree
          enum:
            - Associate
            - Bachelor
            - Master
            - Doctorate
            - Professional
            - Certificate
            - Diploma
        degreeType:
          type: string
          description: Type of degree
          enum:
            - Baccalaureate
            - Graduate
            - Professional
            - Undergraduate
        conferredDate:
          type: string
          format: date
          description: Date degree was conferred
        major:
          type: string
          description: Primary major
        minor:
          type: string
          description: Minor field of study
        awardedHonors:
          type: string
          description: Honors received with degree
          enum:
            - Cum Laude
            - Magna Cum Laude
            - Summa Cum Laude
            - WithDistinction
            - WithHonors
        gpa:
          type: number
          format: float
          description: GPA at graduation
          minimum: 0.0
          maximum: 4.0

    Organization:
      type: object
      description: Represents an educational organization
      required:
        - organizationId
        - organizationName
        - organizationType
      properties:
        organizationId:
          type: string
          description: Unique organization identifier
        organizationName:
          type: string
          description: Name of the organization
        organizationType:
          type: string
          description: Type of educational organization
          enum:
            - University
            - College
            - HighSchool
            - VocationalSchool
            - TrainingCenter
            - TradingSchool
            - OnlineSchool
            - Other
        address:
          $ref: '#/components/schemas/Address'
        phoneNumber:
          type: string
          format: phone
          description: Contact phone number
        emailAddress:
          type: string
          format: email
          description: Contact email address
        website:
          type: string
          format: uri
          description: Organization website URL
        accreditationStatus:
          type: string
          description: Accreditation status
          enum:
            - Accredited
            - Probation
            - NotAccredited
            - Unknown
        opeid:
          type: string
          description: Office of Postsecondary Education ID

    Address:
      type: object
      description: Represents a physical address
      properties:
        street1:
          type: string
          description: First line of street address
        street2:
          type: string
          description: Second line of street address (apartment, suite, etc.)
        city:
          type: string
          description: City name
        state:
          type: string
          description: State or province code
        postalCode:
          type: string
          description: Postal code or ZIP code
        country:
          type: string
          description: Country code (ISO 3166-1 alpha-2)
        addressType:
          type: string
          description: Type of address
          enum:
            - Residential
            - Mailing
            - Billing
            - Business

    PaginationMeta:
      type: object
      description: Pagination metadata for list responses
      properties:
        totalRecords:
          type: integer
          format: int32
          description: Total number of records available
        pageSize:
          type: integer
          format: int32
          description: Number of records in current page
        pageNumber:
          type: integer
          format: int32
          description: Current page number
        totalPages:
          type: integer
          format: int32
          description: Total number of pages
        hasNextPage:
          type: boolean
          description: Whether there is a next page
        hasPreviousPage:
          type: boolean
          description: Whether there is a previous page

    ErrorResponse:
      type: object
      description: Standard error response
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true

  responses:
    BadRequest:
      description: Bad Request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Not Found - Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token for API authentication

    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication

security:
  - bearerAuth: []
  - apiKey: []
